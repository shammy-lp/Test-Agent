name: Scheduled Task

on:
  schedule:
    # Runs every day at 07:00 UTC — edit to fit your timing
    - cron: '0 7 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  run-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up runtime (example: Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the task
        run: |
          echo "Replace this with your actual script or command"
          # e.g. node scripts/my-task.js
          # or: python scripts/my_task.py
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}  # only if the task needs a credential

      - name: Notify on failure (optional)
        if: failure()
        run: echo "Add a Slack/email notification step here if desired"
